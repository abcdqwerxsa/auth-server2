apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-server
  namespace: fuyao-oauth
  labels:
    application: "oauth-server"
spec:
  replicas: 1
  selector:
    matchLabels:
      application: "oauth-server"
  template:
    metadata:
      labels:
        application: "oauth-server"
    spec:
      serviceAccountName: oauth-server
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: init-permission
          image: {{ .Values.image.busyBox }}
          command: ["sh", "-c", "chmod -R 700 /var/log/oauth-server && chown -R 65532:65532 /var/log/oauth-server"]
          volumeMounts:
            - name: log-path
              mountPath: /var/log/oauth-server
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: oauth-server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.config.httpServerConfig.port }}
          args:
            - --configFile=config.json
          volumeMounts:
            - name: config-volume
              readOnly: true
              subPath: config.json
              mountPath: /config.json
            - name: log-path
              mountPath: /var/log/oauth-server
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
      volumes:
        - name: config-volume
          configMap:
            defaultMode: 0600
            name: oauth-server-config
        - name: log-path
          hostPath:
            path: /var/log/oauth-server
            type: DirectoryOrCreate