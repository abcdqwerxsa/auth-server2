kind: ServiceAccount
apiVersion: v1
metadata:
  name: oauth-server
  namespace: fuyao-oauth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oauth-user-role
  namespace: oauth-user
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oauth-user-rolebinding
  namespace: oauth-user
subjects:
  - kind: ServiceAccount
    name: oauth-server
    namespace: fuyao-oauth
roleRef:
  kind: Role
  name: oauth-user-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oauth-code-token-role
  namespace: oauth-code-token
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oauth-code-token-rolebinding
  namespace: oauth-code-token
subjects:
  - kind: ServiceAccount
    name: oauth-server
    namespace: fuyao-oauth
roleRef:
  kind: Role
  name: oauth-code-token-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jwt-cookie-read-role
  namespace: fuyao-oauth
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jwt-cookie-read-rolebinding
  namespace: fuyao-oauth
subjects:
  - kind: ServiceAccount
    name: oauth-server
    namespace: fuyao-oauth
roleRef:
  kind: Role
  name: jwt-cookie-read-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webhook-auth
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: oauth-server-webhook-auth
subjects:
  - kind: ServiceAccount
    name: oauth-server
    namespace: fuyao-oauth
roleRef:
  kind: ClusterRole
  name: webhook-auth
  apiGroup: rbac.authorization.k8s.io