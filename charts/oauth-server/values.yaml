# Default values for oauth-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

config:
  httpServerConfig:
    port: 9096

  loginSessionConfig:
    maxSeconds: 7200
    signingKey: "auth"
    encryptionKey: "encrypt123123123"

  ipProtectorConfig:
    failTimes: "5"
    failDuration: "5m"
    lockDuration: "20m"

  oauthServerConfig:
    authCodeExp: "5m"
    accessTokenExp: "2h"
    clientSecret:
      console: "console-password"
      oauthProxy: "SECRETTS"

image:
  repository: "harbor.openfuyao.com/openfuyao/oauth-server"
  tag: "v24.06"
  pullPolicy: "Always"
  digest: "sha256:6b3169dc118fb4c479a6fc4e81653b2c431e906633d786955c739dce69992668"
